[package]
# The Python bindings: `pip install fuzzy-jev`, then `import jev`. Built by maturin
# (pyproject.toml), not published to crates.io.
name = "fuzzy-jev-python"
version = "0.5.0"
edition = "2021"
description = "Python bindings for fuzzy-jev: typed Choice, Score and Noul answers from TypeSafe's Jev, and fuzzy rules over them."
repository = "https://github.com/dsaad68/fuzzy-jev"
license = "MIT"
publish = false

[lib]
# The extension module is `jev._jev`, re-exported by `jev/__init__.py`.
name = "_jev"
crate-type = ["cdylib"]

[dependencies]
# `command` for the rules, the reply's printing and the questions file, without the CLI.
jev = { package = "fuzzy-jev", path = "..", default-features = false, features = ["command"] }
# abi3: one wheel per platform for every Python from 3.10 on.
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
# Python values to and from the JSON the endpoint takes: a state, instructions and criteria can be
# any JSON value.
pythonize = "0.29"
# `decide_async`, and the runtime `decide` blocks on.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
strip = true
