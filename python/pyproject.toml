[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fuzzy-jev"
description = "A client for OpenRouter's decision models, TypeSafe's Jev by default: typed Choice, Score and Noul answers about text and images, fuzzy rules over them, and drawings of those rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["fuzzy-logic", "llm", "classification", "openrouter"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/dsaad68/fuzzy-jev"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8"]

[tool.maturin]
module-name = "jev._jev"
python-source = "."
