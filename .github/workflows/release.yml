# The `jev` binary for Linux and macOS, on both architectures.
#
# Every run leaves four downloadable artifacts, one per target, each a `.tar.gz` holding the
# binary. Artifacts last 90 days and need a GitHub login to download; a run started by pushing a
# tag (`v1.2.3`) also puts the same files on a Release, where anyone can fetch them with no login.
#
# Each Linux target builds on a runner of its own architecture; the Arm runners are free for public
# repositories. Both macOS targets build on the Apple-silicon runner, which carries the SDK for
# Intel too, so `--target x86_64-apple-darwin` cross-compiles there — GitHub is retiring the Intel
# image, and a job asking for it waits for a runner that is on its way out.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One target failing says nothing about the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Named for what it is and where it runs, so four downloads don't become four files called
      # `jev`. The version comes from Cargo.toml, so a tag that disagrees with it is visible.
      - name: Package
        id: package
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"name":"jev","version":"\([^"]*\)".*/\1/p')
          name="jev-${version}-${{ matrix.target }}"
          tar -czf "${name}.tar.gz" -C "target/${{ matrix.target }}/release" jev
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          shasum -a 256 "${name}.tar.gz" | tee "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  # Only for a tag: the same files again, on a Release, where they can be downloaded without a
  # GitHub login. `contents: write` lives here alone, and not in the jobs that build.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
